<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elix Pro - Workspace</title>

    <!-- Cargador de Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- JSZip: lectura local de DOCX/PPTX adjuntos -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <!-- Lectura local de Excel y PDF para adjuntos de Elix Mini O1 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <!-- Firebase Authentication (usuario + contraseña, sin Google) -->
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>

    <!-- Configuración y Cargador de MathJax para renders matemáticos -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
     @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
    /* Paleta Dark Pro (Elegante y Científica) */
    --sidebar-bg: #09090b; /* Fondo muy oscuro */
    --sidebar-hover: #18181b; 
    --main-bg: #000000; /* Fondo principal negro profundo */
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --accent-color: #3b82f6; /* Azul pepa profesional */
    --accent-hover: #2563eb;
    --border-color: #27272a;
    --user-bg: #18181b;
    --ai-bg: #09090b;
    
    /* Sombras y bordes Pro en Modo Oscuro */
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    --shadow-floating: 0 20px 40px -10px rgba(59, 130, 246, 0.15);
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;
}

body { 
    margin: 0; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    display: flex; 
    height: 100vh; 
    color: var(--text-primary); 
    background-color: var(--main-bg); 
    -webkit-font-smoothing: antialiased;
}

/* --- BARRA LATERAL --- */
.sidebar { 
    width: 290px; 
    background-color: var(--sidebar-bg); 
    display: flex; 
    flex-direction: column; 
    border-right: 1px solid var(--border-color); 
    transition: width 0.3s ease; 
    z-index: 10;
}
.sidebar-header { padding: 24px 20px 16px 20px; }
.btn-new-chat { 
    width: 100%; 
    background: linear-gradient(135deg, var(--accent-hover), #1d4ed8); 
    color: white; 
    border: none; 
    padding: 12px; 
    border-radius: var(--radius-md); 
    font-size: 0.95rem; 
    font-weight: 500; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px; 
    box-shadow: var(--shadow-md); 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
}
.btn-new-chat:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 8px 20px -3px rgba(59, 130, 246, 0.4);
}
.chat-list { 
    flex-grow: 1; 
    overflow-y: auto; 
    padding: 0 12px 20px 12px; 
}
.chat-item { 
    padding: 12px 14px; 
    margin-bottom: 6px; 
    border-radius: var(--radius-md); 
    cursor: pointer; 
    font-size: 0.9rem; 
    color: var(--text-secondary); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    transition: all 0.2s ease; 
    border: 1px solid transparent;
}
.chat-item-title { 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    flex-grow: 1; 
}
.chat-item:hover { 
    background-color: var(--sidebar-hover); 
    color: var(--text-primary); 
}
.chat-item.active { 
    background-color: rgba(39, 39, 42, 0.6); 
    color: var(--accent-color); 
    font-weight: 600; 
    border-color: #3f3f46;
    box-shadow: var(--shadow-sm);
}

/* Acciones de Chat */
.chat-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s ease;
}
.chat-item:hover .chat-actions, .chat-item.active .chat-actions { opacity: 1; }
.btn-action-chat { 
    background: none; 
    border: none; 
    color: #71717a; 
    cursor: pointer; 
    font-size: 1rem; 
    padding: 4px; 
    border-radius: 6px; 
    transition: all 0.2s ease; 
}
.btn-action-chat:hover { background-color: #3f3f46; color: var(--text-primary); }
.btn-action-chat.delete:hover { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }

/* --- ÁREA PRINCIPAL Y CHAT --- */
.main-content { 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
    height: 100vh;
    overflow: hidden;
    position: relative; 
    background: radial-gradient(circle at top right, #09090b, #000000); 
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    z-index: 30;
    flex-shrink: 0;
}

.app-title {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.app-title::before {
    content: '🧬'; 
    font-size: 1.3rem;
}

/* MENÚ DE EXPORTACIÓN DESPLEGABLE */
.export-dropdown {
    position: relative;
    display: inline-block;
}
.btn-export-main {
    background: rgba(24, 24, 27, 0.8);
    backdrop-filter: blur(8px);
    color: var(--text-primary); 
    border: 1px solid var(--border-color); 
    padding: 10px 20px; 
    border-radius: var(--radius-full); 
    cursor: pointer; 
    font-weight: 600; 
    font-size: 0.9rem; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-export-main:hover {
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15); 
    border-color: #3f3f46;
    background: rgba(39, 39, 42, 0.9);
    transform: translateY(-1px);
}
.dropdown-content {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    right: 0;
    top: 120%;
    background-color: #18181b;
    min-width: 160px;
    border-radius: var(--radius-md);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border-color);
    z-index: 40;
    transform: translateY(-10px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
}
.export-dropdown:hover .dropdown-content {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
}
.dropdown-content button {
    width: 100%;
    text-align: left;
    color: var(--text-primary);
    padding: 12px 16px;
    background: none;
    border: none;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
}
.dropdown-content button:hover { background-color: #27272a; }
.dropdown-content button:active { background-color: #3f3f46; }

.chat-container { 
    flex-grow: 1; 
    overflow-y: auto; 
    padding: 30px 10%; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    gap: 36px; 
    scroll-behavior: smooth; 
}

.message-row { 
    display: flex; 
    gap: 20px; 
    max-width: 100%;
    width: 100%;
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.message-row.user { flex-direction: row-reverse; }
.avatar { 
    width: 40px; 
    height: 40px; 
    border-radius: var(--radius-md); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.1rem; 
    flex-shrink: 0; 
    font-weight: 600;
    box-shadow: var(--shadow-sm);
}
.avatar-ai { 
    background: linear-gradient(135deg, var(--accent-hover), #1d4ed8); 
    color: #ffffff; 
}
.avatar-user { 
    background-color: #27272a; 
    color: var(--text-primary); 
    border: 1px solid #3f3f46;
    border-radius: var(--radius-full);
}
.message-content { 
    max-width: 80%; 
    line-height: 1.75; 
    font-size: 0.98rem; 
    color: var(--text-primary); 
    padding: 20px 24px; 
    border-radius: var(--radius-lg); 
    overflow-x: auto; 
}
.user .message-content { 
    background-color: var(--user-bg); 
    border-top-right-radius: 4px; 
    border: 1px solid var(--border-color);
}
.ai .message-content { 
    background-color: var(--ai-bg); 
    border: 1px solid #27272a; 
    border-top-left-radius: 4px; 
    box-shadow: 0 8px 30px rgba(0,0,0,0.2); 
}
.message-content p { margin: 0 0 14px 0; }
.message-content p:last-child { margin-bottom: 0; }
.message-content h1, .message-content h2, .message-content h3 { 
    color: var(--accent-color); 
    margin-top: 24px; 
    margin-bottom: 12px;
    font-weight: 600;
}
.message-content table { 
    border-collapse: collapse; 
    width: 100%; 
    margin: 16px 0; 
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border-color);
}
.message-content th, .message-content td { 
    border-bottom: 1px solid var(--border-color); 
    padding: 12px 16px; 
    text-align: left; 
}
.message-content th { background-color: #18181b; font-weight: 600; color: var(--text-secondary); }

/* --- CAJA DE RAZONAMIENTO (THINKING) --- */
.thinking-box { 
    background-color: #18181b; 
    border-left: 4px solid var(--accent-hover); 
    padding: 16px; 
    margin-bottom: 20px; 
    border-radius: 0 var(--radius-md) var(--radius-md) 0; 
    font-size: 0.9rem; 
}
.thinking-box summary { 
    cursor: pointer; 
    font-weight: 500; 
    color: var(--accent-hover); 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    user-select: none;
    transition: color 0.2s;
}
.thinking-box summary:hover { color: #60a5fa; }
.thinking-text { 
    margin-top: 14px; 
    font-size: 0.85rem; 
    color: var(--text-secondary); 
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    line-height: 1.6;
}

/* --- ÁREA DE ENTRADA (INPUT) MEJORADA --- */
.input-wrapper { 
    flex-shrink: 0; 
    padding: 20px 10% 32px 10%; 
    background: linear-gradient(to top, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0.8) 70%, transparent); 
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.input-box { 
    width: 100%;
    max-width: 950px;
    background-color: rgba(24, 24, 27, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08); 
    border-radius: 24px; 
    padding: 18px 24px; 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
    box-shadow: var(--shadow-floating); 
    transition: box-shadow 0.3s ease, border-color 0.3s;
}
.input-box:focus-within {
    box-shadow: 0 25px 60px -12px rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.4);
}

.input-controls { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    padding-bottom: 14px; 
    border-bottom: 1px solid var(--border-color); 
}
.control-group { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
    font-size: 0.88rem; 
    color: var(--text-secondary); 
    font-weight: 500;
}
select { 
    background: #18181b; 
    border: 1px solid var(--border-color); 
    padding: 8px 14px; 
    border-radius: 8px; 
    font-size: 0.88rem; 
    cursor: pointer; 
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s;
    font-weight: 600;
}
select option {
    background-color: #18181b;
    color: var(--text-primary);
}
select:hover { border-color: #3f3f46; }
select:focus { border-color: var(--accent-color); }
.highlight-select { background-color: rgba(37, 99, 235, 0.1); border-color: rgba(37, 99, 235, 0.5); color: #60a5fa; }

.textarea-container { 
    display: flex; 
    gap: 16px; 
    align-items: center; 
}
textarea { 
    flex-grow: 1; 
    background: transparent; 
    border: none; 
    resize: none; 
    outline: none; 
    font-family: inherit; 
    font-size: 1.05rem; 
    line-height: 1.6;
    max-height: 250px; 
    padding: 12px 0; 
    color: var(--text-primary);
}
textarea::placeholder { color: #52525b; }
.btn-icon { 
    background-color: #18181b; 
    color: #a1a1aa; 
    border: 1px solid transparent; 
    width: 48px; 
    height: 48px; 
    border-radius: var(--radius-md); 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.3rem; 
    transition: all 0.2s; 
}
.btn-icon:hover { background-color: #27272a; color: var(--accent-color); }
.btn-send { 
    background: linear-gradient(135deg, var(--accent-hover), #1d4ed8);
    color: white; 
    border-radius: 50%; 
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
}
.btn-send:hover { transform: scale(1.05); color: white; box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }
.btn-send:disabled { background: #3f3f46; cursor: not-allowed; transform: none; box-shadow: none; color: #71717a; }

/* --- ESTADO DEL SISTEMA --- */
.system-status { 
    display: none; 
    align-items: center; 
    gap: 12px; 
    font-size: 0.85rem; 
    color: #60a5fa; 
    font-weight: 600; 
    justify-content: center; 
    background: #18181b;
    padding: 10px 24px;
    border-radius: var(--radius-full);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    position: absolute !important;
    top: -28px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    border: 1px solid rgba(59, 130, 246, 0.2);
    z-index: 50;
}
.spinner { 
    width: 16px; 
    height: 16px; 
    border: 2px solid #27272a; 
    border-top: 2px solid var(--accent-color); 
    border-radius: 50%; 
    animation: spin 0.8s linear infinite; 
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- SCROLLBAR PRO --- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { 
    background: #3f3f46; 
    border-radius: 10px; 
    border: 2px solid transparent; 
    background-clip: padding-box; 
}
::-webkit-scrollbar-thumb:hover { background-color: #52525b; }

.chat-container::after {
    content: "";
    display: block;
    min-height: 50px;
    width: 100%;
    flex-shrink: 0;
}
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="crearNuevoChat()">+ Nuevo Análisis</button>
        </div>
        <div class="chat-list" id="chat-list"></div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="app-title">Elix Pro</h1>
            
            <div class="export-dropdown">
                <button class="btn-export-main" id="btn-main-export"><span class="export-icon">⬇️</span><span class="export-label">Exportar Documento</span></button>
                <div class="dropdown-content">
                    <button onclick="exportarPDFSoloRespuestas()">📄 Guardar como PDF</button>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chat-history"></div>

        <div class="input-wrapper">
            <div id="loading" class="system-status">
                <div class="spinner"></div>
                <span id="loading-text">Elix Pro procesando...</span>
            </div>
            
            <div class="input-box">
                <div class="input-controls">
                    <div class="control-group">
                        <div>
                            Modo Académico: 
                            <select id="academic-mode" class="highlight-select" onchange="this.className = this.value !== 'none' ? 'highlight-select' : ''">
                                <option value="none">Desactivado</option>
                                <option value="apa7" selected>APA 7ma Edición</option>
                                <option value="vancouver">Vancouver</option>
                                <option value="ieee">IEEE</option>
                            </select>
                        </div>
                        <span style="color:#3f3f46;">|</span>
                        <div>
                            Modo de Análisis: 
                            <select id="thinking-level">
                                <option value="low">Rápido (Directo)</option>
                                <option value="medium" selected>Estándar (Equilibrado)</option>
                                <option value="high">Riguroso (Técnico)</option>
                                <option value="max">Profundo (Élite)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="textarea-container">
                    <button class="btn-icon" title="Adjuntar Archivo" onclick="document.getElementById('file-upload').click()">📎</button>
                    <input type="file" id="file-upload" style="display:none" multiple accept=".pdf,.docx,.pptx,.xlsx,.xls,.csv,.txt,.md,.json,image/*" onchange="elixSeleccionarArchivos(event)">
                    
                    <textarea id="user-input" rows="1" placeholder="Escribe tu consulta científica o adjunta un archivo..." oninput="autoResize(this)" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); enviarMensaje(); }"></textarea>
                    
                    <button class="btn-icon btn-send" id="btn-send" onclick="enviarMensaje()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. BACKEND NETLIFY — SIN CLAVES PRIVADAS EN EL FRONTEND
        // ==========================================
        const ELIX_API_BASE = '/.netlify/functions';
        const ELIX_GEMINI_MODEL = 'gemini-3.1-flash-lite';

        // Modelos de Groq usados por Elix Mini O1. No son secretos; la API key vive en Netlify.
        const GROQ_MODELS_FALLBACK = [
            "qwen/qwen3.8-27b",
            "openai/gpt-oss-120b",
            "openai/gpt-oss-20b"
        ];

        async function elixBackend(nombre, payload = {}) {
            const response = await fetch(`${ELIX_API_BASE}/${nombre}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let data = {};
            try { data = await response.json(); } catch (_) {}

            if (!response.ok) {
                const mensaje = data?.error || data?.message || `${response.status} ${response.statusText}`;
                const error = new Error(mensaje || 'Error del backend de Elix.');
                error.status = response.status;
                throw error;
            }
            return data;
        }

        function elixNuevoJobId() {
            const uuid = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
                ? globalThis.crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
            return `elix-${uuid}`.replace(/[^a-zA-Z0-9_-]/g, '');
        }

        function elixFormatoEspera(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const min = Math.floor(total / 60);
            const seg = String(total % 60).padStart(2, '0');
            return min > 0 ? `${min}:${seg}` : `${total}s`;
        }

        async function elixBackground(nombre, payload = {}, opciones = {}) {
            const jobId = elixNuevoJobId();
            const etiqueta = opciones.etiqueta || 'Elix procesando';
            // Netlify Background Functions pueden trabajar mucho más que una Function síncrona.
            // Dejamos margen antes del límite de ejecución de background.
            const maxWaitMs = Number(opciones.maxWaitMs) > 0 ? Number(opciones.maxWaitMs) : 14 * 60 * 1000;
            const inicio = Date.now();

            const inicioResponse = await fetch(`${ELIX_API_BASE}/${nombre}-background`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...payload, job_id: jobId })
            });

            if (!inicioResponse.ok) {
                let data = {};
                try { data = await inicioResponse.json(); } catch (_) {}
                const mensaje = data?.error || data?.message || `${inicioResponse.status} ${inicioResponse.statusText}`;
                const error = new Error(mensaje || `No se pudo iniciar ${etiqueta}.`);
                error.status = inicioResponse.status;
                throw error;
            }

            // El resultado vive en Netlify Blobs; esta petición solo consulta el estado,
            // por lo que nunca mantiene abierta una Function durante todo el razonamiento.
            while (true) {
                const elapsed = Date.now() - inicio;
                if (elapsed > maxWaitMs) {
                    throw new Error(`${etiqueta} excedió el tiempo máximo de una tarea background en Netlify.`);
                }

                if (typeof setCargando === 'function') {
                    setCargando(true, `${etiqueta} · ${elixFormatoEspera(elapsed)}`);
                }

                const estado = await elixBackend('ai-job-status', { job_id: jobId });

                if (estado?.status === 'done') {
                    return estado.result;
                }

                if (estado?.status === 'error') {
                    const error = new Error(estado?.error || `${etiqueta} no pudo completarse.`);

        // ESTA ES LA FUNCIÓN MEJORADA QUE PROTEGE LAS ECUACIONES MATEMÁTICAS (CORREGIDA)
        function formatTextoMarkdown(text) { 
            if (!text) return '';
            
            let procesado = text;
            
            // 1. Convertir delimitadores de LaTeX a los estándar ($$ y $)
            procesado = procesado.replace(/\\\[/g, '$$$$').replace(/\\\]/g, '$$$$');
            procesado = procesado.replace(/\\\(/g, '$').replace(/\\\)/g, '$');

            // 2. Extraer y proteger las ecuaciones matemáticas
            const mathBlocks = [];
            let counter = 0;

            // Busca tanto bloques $$...$$ como $...$ y entornos \begin...\end (Corregido para que markdown no interfiera)
            procesado = procesado.replace(/\$\$[\s\S]*?\$\$|\$[\s\S]*?\$|\\begin\{[^}]+\}[\s\S]*?\\end\{[^}]+\}/g, (match) => {
                const id = `MATHBLOCKPLACEHOLDER${counter}END`;
                mathBlocks.push(match);
                counter++;
                return id;
            });

            // 3. Procesar el texto limpio con Markdown
            let htmlFormateado = typeof marked !== 'undefined' ? marked.parse(procesado) : procesado;

            // 4. Devolver las ecuaciones exactas a su lugar
            mathBlocks.forEach((math, index) => {
                // Se usa una función () => math para evitar que JS elimine símbolos $
                htmlFormateado = htmlFormateado.replace(`MATHBLOCKPLACEHOLDER${index}END`, () => math);
            });

            return htmlFormateado; 
        }

        function escapeHTML(str) { return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function renderizarListaChats() {
            const listDiv = document.getElementById('chat-list');

                const item = document.createElement('div');

                item.onclick = () => seleccionarChat(chat.id);
                
                item.innerHTML = `

                    <div class="chat-actions">
                        <button class="btn-action-chat" title="Renombrar" onclick="renombrarChat('${chat.id}', event)">✏️</button>
                        <button class="btn-action-chat delete" title="Eliminar" onclick="eliminarChat('${chat.id}', event)">🗑️</button>

        function renderizarMensajesActuales() {

        function agregarMensajeUI(rol, texto, razonamiento = null, adjuntos = []) {

                : '';
            row.innerHTML = `<div class="avatar ${isUser ? 'avatar-user' : 'avatar-ai'}">${isUser ? 'U' : 'E'}</div><div class="message-content">${adjuntosHTML}${bloqueReasoningHTML}<div>${textoFormateado}</div></div>`;
            chatContainer.appendChild(row);

        function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = (textarea.scrollHeight < 150 ? textarea.scrollHeight : 150) + 'px'; }
        
        function setCargando(estado, texto = "Elix Pro procesando...") {

        // ==========================================
        // 2. TAVILY (ELIX WEB SEARCH)
        // ==========================================
        async function buscarEnTavily(query) {
            const consulta = String(query || '').trim();
            if (!consulta) throw new Error('La consulta de búsqueda está vacía.');
            const data = await elixBackground('tavily-search', { query: consulta }, { etiqueta: '🌍 Elix Search buscando fuentes' });
            const resultados = Array.isArray(data?.results) ? data.results : [];
            if (!resultados.length) throw new Error('Tavily no devolvió resultados para esta consulta.');
            return resultados.map((r, i) => {
                const titulo = r?.title || `Resultado ${i + 1}`;
                const url = r?.url || '';
                const contenido = r?.content || r?.snippet || '';
                return `Fuente ${i + 1} (${titulo}${url ? ` - ${url}` : ''}): ${contenido}`;
            }).join('\n\n');
        }

        window.buscarEnTavily = buscarEnTavily;

        async function generarQueryBusqueda(query) {
            try {
                const prompt = `Extrae únicamente las palabras clave principales de búsqueda académica/web (máximo 6 palabras clave en español o inglés) para buscar fuentes relevantes en Tavily/Google. No agregues explicaciones ni comillas. Solicitud: "${query}"`;
                const data = await elixBackground('gemini-generate', { payload: {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.1, maxOutputTokens: 30 }
                }});
                return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim() || query;
            } catch (e) {
                return query;
            }
        }

        // ==========================================
        // 3. GEMINI COMO ROUTER (DECISIÓN DE BÚSQUEDA)
        // ==========================================
        async function elixFlashEvaluaBusqueda(query, academicMode) {
            if (String(academicMode || 'none').toLowerCase() !== 'none') return true;
            try {
                const prompt = `Actúa como un enrutador inteligente de búsqueda científica y web. Responde ÚNICAMENTE SI o NO. Responde SI si la solicitud requiere bibliografía, fuentes, información actualizada o internet. Solicitud: "${query}"`;
                const data = await elixBackground('gemini-generate', { payload: {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.0, maxOutputTokens: 5 }
                }});
                const respuesta = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim().toUpperCase() || '';
                return respuesta.startsWith('SI');
            } catch (e) {
                console.warn('Elix Flash Router falló; se continuará sin bloquear el chat:', e);
                return false;
            }
        }

        // ==========================================

        async function enviarMensaje() {
            const inputField = document.getElementById('user-input');
            let peticionOriginal = inputField.value.trim();
            const contextoArchivosElix = String(window.ELIX_CONTEXT_ARCHIVOS_PENDIENTE || '');
            const adjuntosElix = Array.isArray(window.ELIX_ADJUNTOS_EN_ENVIO) ? window.ELIX_ADJUNTOS_EN_ENVIO : [];
            if (!peticionOriginal && contextoArchivosElix) peticionOriginal = 'Analiza los archivos adjuntos.';
            const nivelThinking = document.getElementById('thinking-level').value;
            const academicMode = document.getElementById('academic-mode').value;

            if (!peticionOriginal) return;

            inputField.value = '';
            inputField.style.height = 'auto';
            agregarMensajeUI('user', peticionOriginal, null, adjuntosElix);

            const chatActual = obtenerChatActual();
            if (chatActual.messages.length === 0) {
                chatActual.title = peticionOriginal.substring(0, 25) + "...";
                renderizarListaChats();
            }

            setCargando(true, "⚡ Elix Flash evaluando solicitud académica...");
            
            let contextoWeb = "";
            const requiereInternet = await window.elixFlashEvaluaBusqueda(peticionOriginal, academicMode);
            
            if (requiereInternet) {
                setCargando(true, "🌍 Elix Search obteniendo fuentes...");
                try {
                    const queryOptimizada = await window.generarQueryBusqueda(peticionOriginal);
                    contextoWeb = await window.buscarEnTavily(queryOptimizada);
                } catch (e) {
                    console.warn("Aviso de búsqueda web:", e);
                    const detalle = e?.message || String(e);
                    setCargando(true, `⚠️ Elix Search: ${detalle}`);
                    await new Promise(resolve => setTimeout(resolve, 1400));
                }
            }

            let promptEnriquecido = `[DIRECTIVA DE SISTEMA: ${directivasThinking[nivelThinking]}]\n`;
            promptEnriquecido += `[REGLA DE FORMATO MATEMÁTICO: Escribe TODAS las ecuaciones en formato LaTeX puro. Usa SIEMPRE "$$" para ecuaciones en bloque y "$" para ecuaciones en línea. ESTÁ ESTRICTAMENTE PROHIBIDO usar corchetes o paréntesis como delimitadores matemáticos.]\n\n`;
            
            if (academicMode !== "none") {
                let especificidadAPA = academicMode === "apa7" ? "Aplica rigurosamente las normas APA 7ma Edición." : "";
                promptEnriquecido += `[DIRECTIVA ACADÉMICA ESTRICTA]: Integra citas en el texto y genera las Referencias Bibliográficas al final en formato ${academicMode.toUpperCase()}. ${especificidadAPA} ESTÁ ESTRICTAMENTE PROHIBIDO RESUMIR O RECORTAR LA INFORMACIÓN. Mantén toda tu explicación técnica y paso a paso original, limitándote únicamente a incorporar el rigor bibliográfico sin sacrificar ni una letra de tu análisis.\n\n`;
            }

            if (contextoWeb) promptEnriquecido += `[INFORMACIÓN ACTUALIZADA / BIBLIOGRAFÍA ENCONTRADA EN LA WEB]:\n${contextoWeb}\n\n[FIN DE LA INFORMACIÓN WEB]\n\nUtiliza la información anterior si es relevante para citar y respaldar tu respuesta académica a la siguiente solicitud:\n`;
            if (contextoArchivosElix) {
                promptEnriquecido += `\n[CONTEXTO DE ARCHIVOS PROCESADO POR ELIX MINI O1 / GROQ]:\n${contextoArchivosElix}\n[FIN DEL CONTEXTO DE ARCHIVOS]\n\n`;
            }
            promptEnriquecido += peticionOriginal;

            chatActual.messages.push({ role: 'user', content: promptEnriquecido, displayContent: peticionOriginal, attachments: adjuntosElix });
            guardarEnLocal();

            setCargando(true, "🧠 Elix Pro analizando y redactando...");

            try {
                const mensajesParaAPI = chatActual.messages.map(m => ({ role: m.role, content: m.content }));
                
                const data = await elixBackground('deepseek-chat', {
                    messages: mensajesParaAPI,
                    max_tokens: 30000
                }, { etiqueta: '🧠 Elix Pro analizando y redactando' });
                
                let respuestaFinal = data.choices[0].message.content;
                let razonamiento = data.choices[0].message.reasoning_content || null;

                chatActual.messages.push({ 
                    role: 'assistant', 
                    content: respuestaFinal,
                    reasoning: razonamiento
                });
                
                guardarEnLocal();
                agregarMensajeUI('assistant', respuestaFinal, razonamiento);


            } catch (error) {
                // Si el usuario detuvo la respuesta, dejamos que el módulo de STOP
                // restaure el prompt sin mostrar un falso error.
                if (error && error.name === 'AbortError') throw error;
                console.error(error);
                const detalle = String(error?.message || 'No se pudo completar la respuesta.');
                const mensajeError = `⚠️ Elix Pro no pudo completar esta respuesta: ${detalle}`;
                chatActual.messages.push({
                    role: 'assistant',
                    content: mensajeError,
                    reasoning: null,
                    isError: true
                });
                guardarEnLocal();
                agregarMensajeUI('assistant', mensajeError);
            } finally {
                setCargando(false);
            }
        }

        // ==========================================
        // 5. ELIX FLASH LEYENDO ARCHIVOS
        // ==========================================
        async function procesarArchivoConGemini(event) {
            const file = event.target.files[0];
            if (!file) return;
            setCargando(true, `✨ Elix Flash extrayendo datos de ${file.name}...`);
            try {
                const reader = new FileReader();
                const dataUrl = await new Promise((resolve, reject) => {
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(reader.error || new Error('No se pudo leer el archivo.'));
                    reader.readAsDataURL(file);
                });
                const base64Data = String(dataUrl).split(',')[1] || '';
                const data = await elixBackground('gemini-generate', { payload: {
                    contents: [{ parts: [
                        { text: 'Eres un extractor de datos de precisión. Extrae textualmente todo el contenido científico, ecuaciones y datos de este documento. Preséntalo de forma limpia en texto plano.' },
                        { inlineData: { data: base64Data, mimeType: file.type || 'application/octet-stream' } }
                    ]}]
                }});
                const texto = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
                const inputField = document.getElementById('user-input');
                inputField.value += `[Contexto del documento ${file.name} extraído por Elix Flash]:\n${texto}\n\n`;
                autoResize(inputField);
            } catch (error) {
                console.error(error);
                alert('Error procesando el archivo con Elix Flash.');
            } finally {
                setCargando(false);
                event.target.value = '';
            }
        }

        // PDF se mantiene como única exportación.

        function exportarPDFSoloRespuestas() { window.print(); }
    </script>

    <script>
        (function() {

            const btnSend = document.getElementById('btn-send');
            const SEND_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
            const STOP_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>`;

            let abortController = null;
            let solicitudActiva = false;

            function actualizarBotonEnvio(estaGenerando) {
                solicitudActiva = estaGenerando;
                btnSend.classList.toggle('is-stopping', estaGenerando);
                btnSend.innerHTML = estaGenerando ? STOP_ICON : SEND_ICON;
                btnSend.title = estaGenerando ? 'Detener respuesta' : 'Enviar mensaje';
                btnSend.setAttribute('aria-label', estaGenerando ? 'Detener respuesta' : 'Enviar mensaje');
                // Durante una respuesta debe seguir siendo clicable para poder detenerla.
                btnSend.disabled = false;
            }

            const originalSetCargando = setCargando;
            setCargando = function(estado, texto) {
                originalSetCargando(estado, texto);

                // Solo convertimos Enviar en STOP cuando la carga pertenece al chat.
                // Otros procesos auxiliares conservan el comportamiento original.
                if (estado && abortController) {
                    actualizarBotonEnvio(true);
                } else if (!estado) {
                    actualizarBotonEnvio(false);
                }
            };

            // Interceptar los fetch del flujo del chat para poder abortarlos.
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                if (abortController) {
                    args[1] = args[1] || {};
                    args[1].signal = abortController.signal;
                }
                return await originalFetch.apply(this, args);
            };

            // Envolver enviarMensaje: si ya está generando, el mismo botón detiene.
            const originalEnviarMensaje = enviarMensaje;
            enviarMensaje = async function() {
                if (solicitudActiva && abortController) {
                    abortController.abort();
                    return;
                }

                abortController = new AbortController();
                try {
                    await originalEnviarMensaje();
                } catch (error) {
                    if (error && error.name === 'AbortError') {
                        const chatActual = obtenerChatActual();
                        if (chatActual && chatActual.messages.length > 0) {
                            const lastMsg = chatActual.messages[chatActual.messages.length - 1];
                            if (lastMsg.role === 'user') {
                                const input = document.getElementById('user-input');
                                input.value = lastMsg.displayContent || lastMsg.content;
                                autoResize(input);

                                // Mantiene el comportamiento anterior: al detener, el prompt
                                // vuelve al editor y se retira del historial incompleto.
                                chatActual.messages.pop();
                                guardarEnLocal();
                            }
                        }
                        renderizarMensajesActuales();
                        setCargando(false);
                    } else {
                        console.error(error);
                    }
                } finally {
                    abortController = null;
                    actualizarBotonEnvio(false);
                }
            };

            actualizarBotonEnvio(false);

            // 2. LÁPIZ DE EDICIÓN RESILIENTE (se conserva la lógica existente)
            const originalAgregarMensajeUI = agregarMensajeUI;
            agregarMensajeUI = function(rol, texto, razonamiento, adjuntos) {
                originalAgregarMensajeUI(rol, texto, razonamiento, adjuntos);

                if (rol === 'user') {
                    const container = document.getElementById('chat-history');
                    const row = container.lastElementChild;

                    if (row && row.classList.contains('user')) {
                        const btnEdit = document.createElement('button');
                        btnEdit.className = 'btn-edit-prompt';
                        btnEdit.innerHTML = '✏️';
                        btnEdit.title = 'Editar este mensaje';

                        btnEdit.onclick = function() {
                            const chatActual = obtenerChatActual();
                            if (!chatActual) return;

                            const targetText = (texto || '').trim();
                            const idx = chatActual.messages.findIndex(m =>
                                m.role === 'user' &&
                                ((m.displayContent || '').trim() === targetText || (m.content || '').trim() === targetText)
                            );

                            if (idx !== -1) {
                                chatActual.messages.splice(idx);
                                guardarEnLocal();
                            } else {
                                chatActual.messages.pop();
                                guardarEnLocal();
                            }

                            const input = document.getElementById('user-input');
                            input.value = texto;
                            autoResize(input);
                            input.focus();
                            renderizarMensajesActuales();
                        };
                        row.appendChild(btnEdit);
                    }
                }
            };

            // Inyectar lápices en historiales viejos al cargar la app.
            setTimeout(() => {
                if (obtenerChatActual()?.messages.length > 0) {
                    renderizarMensajesActuales();
                }
            }, 600);
        })();
    </script>

    <script>
        (function() {
            // 3. Interceptar a la fuerza los clics del menú lateral (Fase de Captura)
            // Esto anula el código roto anterior y hace que el lápiz y la papelera funcionen.
            document.addEventListener('click', function(e) {
                const btnRenombrar = e.target.closest('[onclick*="renombrar"]');
                const btnEliminar = e.target.closest('[onclick*="eliminar"]');

                if (btnRenombrar) {
                    e.preventDefault();
                    e.stopPropagation(); // Detiene el error nativo de Electron
                    
                    // Extrae el ID del chat
                    const match = btnRenombrar.getAttribute('onclick').match(/['"]([^'"]+)['"]/);
                    if (match) mostrarModalRenombrar(match[1]);
                    return;
                }

                if (btnEliminar) {
                    e.preventDefault();
                    e.stopPropagation(); // Detiene el error nativo de Electron
                    
                    const match = btnEliminar.getAttribute('onclick').match(/['"]([^'"]+)['"]/);
                    if (match) mostrarModalEliminar(match[1]);
                    return;
                }
            }, true); // 'true' asegura que atrapemos el clic antes de que el HTML original actúe

            function mostrarModalRenombrar(id) {
                const chat = chats.find(c => c.id === id);
                if (!chat) return;

                const overlay = document.createElement('div');
                overlay.className = 'elix-modal-overlay';
                overlay.innerHTML = `
                    <div class="elix-modal-box">
                        <h3 style="margin:0;color:#fafafa;font-size:1.05rem;">Renombrar Análisis</h3>
                        <input type="text" id="modal-input-nombre" value="${chat.title}" style="width:100%;background:#09090b;border:1px solid #3f3f46;color:#fafafa;padding:12px;border-radius:8px;outline:none;">

                            <button id="modal-btn-cancelar" style="background:transparent;color:#a1a1aa;border:none;padding:8px 16px;cursor:pointer;">Cancelar</button>
                            <button id="modal-btn-guardar" style="background:#3b82f6;color:white;border:none;padding:8px 16px;cursor:pointer;border-radius:6px;">Guardar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const input = document.getElementById('modal-input-nombre');
                input.focus(); 
                input.select();

                document.getElementById('modal-btn-cancelar').onclick = () => overlay.remove();
                document.getElementById('modal-btn-guardar').onclick = () => {
                    if (input.value.trim()) {
                        chat.title = input.value.trim();
                        guardarEnLocal();
                        renderizarListaChats();
                    }
                    overlay.remove();
                };
            }

            function mostrarModalEliminar(id) {
                const overlay = document.createElement('div');
                overlay.className = 'elix-modal-overlay';
                overlay.innerHTML = `
                    <div class="elix-modal-box">
                        <h3 style="margin:0;color:#fafafa;font-size:1.05rem;">Eliminar Análisis</h3>
                        <p style="margin:0;color:#a1a1aa;font-size:0.95rem;">¿Estás seguro? Esta acción no se puede deshacer.</p>
                        <div style="display:flex;justify-content:flex-end;gap:12px;">
                            <button id="modal-btn-cancelar2" style="background:transparent;color:#a1a1aa;border:none;padding:8px 16px;cursor:pointer;">Cancelar</button>
                            <button id="modal-btn-eliminar" style="background:#ef4444;color:white;border:none;padding:8px 16px;cursor:pointer;border-radius:6px;">Eliminar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                document.getElementById('modal-btn-cancelar2').onclick = () => overlay.remove();
                document.getElementById('modal-btn-eliminar').onclick = () => {
                    chats = chats.filter(c => c.id !== id);
                    guardarEnLocal();
                    if (chats.length === 0) crearNuevoChat();
                    else seleccionarChat(chats[0].id);
                    overlay.remove();
                };
            }
        })();
    </script>

<script>
(function(){
    'use strict';

    /* =========================================================
       A) GEMINI 3.1 FLASH LITE — VÍA BACKEND NETLIFY
       ========================================================= */
    async function llamarGeminiConFallback(payload, etiqueta = 'Gemini') {
        // Se conserva el nombre por compatibilidad con el resto del archivo,
        // pero ya no hay fallback: TODO Gemini usa gemini-3.1-flash-lite en Netlify.
        const data = await elixBackground('gemini-generate', { payload }, { etiqueta });
        const texto = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
        if (!texto.trim() && !data?.candidates?.length) {
            throw new Error(`${etiqueta}: Gemini devolvió una respuesta vacía.`);
        }
        return { data, model: ELIX_GEMINI_MODEL, text: texto };
    }
    window.llamarGeminiConFallback = llamarGeminiConFallback;

    window.elixFlashEvaluaBusqueda = async function(query, academicMode) {
        const q = String(query || '').trim();
        const qLower = q.toLowerCase();
        const modo = String(academicMode || 'none').toLowerCase();

        const soloFuentesAportadas =
            /(solo|únicamente|unicamente|exclusivamente).{0,40}(bibliograf[ií]a|fuentes|referencias).{0,50}(proporcionad|adjunt|incluid|dadas)/i.test(q) ||
            /(no|sin).{0,20}(buscar|b[uú]squeda|internet|web).{0,30}(fuera|extern|adicional)/i.test(q);

        if (soloFuentesAportadas) return false;
        if (modo !== 'none') return true;

        const señalesWeb = [
            'internet','web','buscar','busca','investiga','investigar',
            'fuente','fuentes','bibliografía','bibliografia','referencia','referencias',
            'artículo','articulo','paper','papers','doi','revista','journal',
            'actual','actualizado','actualizada','reciente','recientes','último','ultimo',
            'noticia','noticias','hoy','este año','2026'
        ];
        if (señalesWeb.some(x => qLower.includes(x))) return true;

        try {
            const prompt = `Actúa como un enrutador de búsqueda web.
Responde ÚNICAMENTE SI o NO.
Responde SI si la solicitud necesita información externa, bibliografía, datos actuales o verificación en internet.
Solicitud: ${q}`;
            const r = await llamarGeminiConFallback({
                contents:[{parts:[{text:prompt}]}],
                generationConfig:{temperature:0, maxOutputTokens:8}
            }, 'Router Gemini');
            return (r.text || '').trim().toUpperCase().startsWith('SI');
        } catch (e) {
            console.warn('Router Gemini no disponible; la consulta continuará sin bloquearse.', e);
            return false;
        }
    };

    window.generarQueryBusqueda = async function(query) {
        try {
            const prompt = `Extrae únicamente hasta 6 palabras clave principales de búsqueda académica/web, en español o inglés. No agregues explicaciones ni comillas. Solicitud: ${query}`;
            const r = await llamarGeminiConFallback({
                contents:[{parts:[{text:prompt}]}],
                generationConfig:{temperature:0.1, maxOutputTokens:40}
            }, 'Query Gemini');
            return r.text.trim() || query;
        } catch (e) {
            console.warn('No se pudo optimizar la query; se usará la consulta original.', e);
            return query;
        }
    };

    function archivoADataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error('No se pudo leer el archivo.'));
            reader.readAsDataURL(file);
        });
    }

    window.procesarArchivoConGemini = async function(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        setCargando(true, `✨ Elix Flash extrayendo datos de ${file.name}...`);
        try {
            const dataUrl = await archivoADataURL(file);
            const base64Data = String(dataUrl).split(',')[1] || '';
            const mimeType = file.type || 'application/octet-stream';
            const r = await llamarGeminiConFallback({
                contents:[{parts:[
                    {text:'Eres un extractor de precisión. Extrae TODO el contenido útil del documento sin resumir ni omitir: texto, tablas, ecuaciones, unidades, encabezados, referencias y datos. Conserva ecuaciones en LaTeX puro. Devuelve texto limpio y completo.'},
                    {inlineData:{data:base64Data, mimeType}}
                ]}],
                generationConfig:{temperature:0}
            }, 'Lectura de archivo');

            const inputField = document.getElementById('user-input');
            inputField.value += `[Contexto del documento ${file.name} extraído por Elix Flash (${r.model})]:\n${r.text}\n\n`;
            autoResize(inputField);
            alert(`Archivo extraído correctamente con ${r.model}.`);
        } catch(error) {
            console.error(error);
            alert(`No se pudo procesar el archivo: ${error.message || error}`);
        } finally {
            setCargando(false);
            event.target.value = '';
        }
    };

    /* =========================================================
       A2) ELIX MINI O1 (GROQ) — SOLO PARA ARCHIVOS ADJUNTOS
       ========================================================= */
    const ELIX_GROQ_MODELS = (typeof GROQ_MODELS_FALLBACK !== 'undefined' && Array.isArray(GROQ_MODELS_FALLBACK))
        ? GROQ_MODELS_FALLBACK
        : ['qwen/qwen3.8-27b','openai/gpt-oss-120b','openai/gpt-oss-20b'];

    let elixAdjuntosPendientes = [];
    let elixMiniProcesando = false;
    const elixPreviewUrls = new Map();

    function elixGroqConfigurado(){
        return true; // La clave se valida en la función Netlify groq-chat.
    }

    function elixExtension(nombre=''){
        const limpio=String(nombre||'').toLowerCase();
        const punto=limpio.lastIndexOf('.');
        return punto>=0 ? limpio.slice(punto+1) : '';
    }

    function elixTamano(bytes){
        const n=Number(bytes||0);
        if(n<1024) return `${n} B`;
        if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`;
        return `${(n/(1024*1024)).toFixed(1)} MB`;
    }

    function elixIconoArchivo(file){
        if(String(file.type||'').startsWith('image/')) return '🖼️';
        const ext=elixExtension(file.name);
        if(ext==='pdf') return '📕';
        if(ext==='docx') return '📘';
        if(ext==='pptx') return '📙';
        if(ext==='xlsx'||ext==='xls'||ext==='csv') return '📗';
        return '📄';
    }

    function elixCrearBandejaAdjuntos(){
        let tray=document.getElementById('elix-attachment-tray');
        if(tray) return tray;
        const textareaContainer=document.querySelector('.textarea-container');
        if(!textareaContainer) return null;
        tray=document.createElement('div');
        tray.id='elix-attachment-tray';
        tray.className='elix-attachment-tray';
        textareaContainer.parentNode.insertBefore(tray, textareaContainer);
        return tray;
    }

    function elixLiberarPreview(file){
        const url=elixPreviewUrls.get(file);
        if(url){
            try { URL.revokeObjectURL(url); } catch(_){}
            elixPreviewUrls.delete(file);
        }
    }

    function elixRenderAdjuntos(){
        const tray=elixCrearBandejaAdjuntos();
        if(!tray) return;
        tray.innerHTML='';
        tray.classList.toggle('has-files', elixAdjuntosPendientes.length>0);

        elixAdjuntosPendientes.forEach((file, index)=>{
            const card=document.createElement('div');
            card.className='elix-attachment-card';

            let visual='';
            if(String(file.type||'').startsWith('image/')){
                let url=elixPreviewUrls.get(file);
                if(!url){
                    url=URL.createObjectURL(file);
                    elixPreviewUrls.set(file,url);
                }
                visual=`<img class="elix-attachment-thumb" src="${url}" alt="">`;
            } else {
                visual=`<div class="elix-attachment-icon">${elixIconoArchivo(file)}</div>`;
            }

            card.innerHTML=`${visual}<div class="elix-attachment-meta"><div class="elix-attachment-name" title="${escapeHTML(file.name)}">${escapeHTML(file.name)}</div><div class="elix-attachment-size">${elixTamano(file.size)}</div></div><button class="elix-attachment-remove" type="button" title="Quitar archivo" aria-label="Quitar archivo">×</button>`;
            card.querySelector('.elix-attachment-remove').onclick=()=>{
                const quitado=elixAdjuntosPendientes[index];
                if(quitado) elixLiberarPreview(quitado);
                elixAdjuntosPendientes.splice(index,1);
                elixRenderAdjuntos();
            };
            tray.appendChild(card);
        });
    }

    window.elixSeleccionarArchivos = function(event){
        const nuevos=Array.from(event.target.files || []);
        for(const file of nuevos){
            const duplicado=elixAdjuntosPendientes.some(f=>f.name===file.name && f.size===file.size && f.lastModified===file.lastModified);
            if(!duplicado) elixAdjuntosPendientes.push(file);
        }
        event.target.value='';
        elixRenderAdjuntos();
    };

    function elixLimpiarAdjuntosPendientes(){
        elixAdjuntosPendientes.forEach(elixLiberarPreview);
        elixAdjuntosPendientes=[];
        elixRenderAdjuntos();
    }

    function elixArchivoADataURLMini(file){
        return new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=()=>resolve(String(reader.result||''));
            reader.onerror=()=>reject(reader.error || new Error(`No se pudo leer ${file.name}`));
            reader.readAsDataURL(file);
        });
    }

    async function elixLlamarGroqConFallback(messages, etiqueta='Elix Mini O1'){
        try {
            const data = await elixBackground('groq-chat', {
                messages,
                models: ELIX_GROQ_MODELS,
                temperature: 0,
                max_tokens: 8192
            }, { etiqueta });
            const salida = String(data?.choices?.[0]?.message?.content || '').trim();
            if (!salida) throw new Error('Elix Mini O1 devolvió una respuesta vacía.');
            return { text: salida, model: data.model || 'Groq', data };
        } catch (error) {
            if (error && error.name === 'AbortError') throw error;
            throw new Error(`${etiqueta}: ${error?.message || error}`);
        }
    }

    function elixTextoDesdeXML(xmlTexto){
        const xml=new DOMParser().parseFromString(xmlTexto,'application/xml');
        if(xml.querySelector('parsererror')) return '';
        const bloques=[];
        const elementos=Array.from(xml.getElementsByTagName('*'));
        const parrafos=elementos.filter(n=>n.localName==='p');

        if(parrafos.length){
            for(const p of parrafos){
                const ts=Array.from(p.getElementsByTagName('*')).filter(n=>n.localName==='t');
                const s=ts.map(n=>n.textContent||'').join('').trim();
                if(s) bloques.push(s);
            }
            return bloques.join('\n');
        }

        return elementos.filter(n=>n.localName==='t').map(n=>n.textContent||'').join(' ').trim();
    }

    async function elixExtraerDOCX(file){
        if(typeof JSZip==='undefined') throw new Error('JSZip no está disponible.');
        const zip=await JSZip.loadAsync(await file.arrayBuffer());
        const candidatos=Object.keys(zip.files)
            .filter(n=>/^word\/(document|footnotes|endnotes|comments|header\d+|footer\d+)\.xml$/i.test(n))
            .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
        const partes=[];
        for(const nombre of candidatos){
            const xml=await zip.file(nombre)?.async('string');
            if(!xml) continue;
            const t=elixTextoDesdeXML(xml);
            if(t) partes.push(`[${nombre}]\n${t}`);
        }
        return partes.join('\n\n');
    }

    async function elixExtraerPPTX(file){
        if(typeof JSZip==='undefined') throw new Error('JSZip no está disponible.');
        const zip=await JSZip.loadAsync(await file.arrayBuffer());
        const nombres=Object.keys(zip.files)
            .filter(n=>/^ppt\/(slides\/slide\d+|notesSlides\/notesSlide\d+)\.xml$/i.test(n))
            .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
        const partes=[];
        for(const nombre of nombres){
            const xml=await zip.file(nombre)?.async('string');
            if(!xml) continue;
            const t=elixTextoDesdeXML(xml);
            if(t) partes.push(`[${nombre}]\n${t}`);
        }
        return partes.join('\n\n');
    }

    async function elixExtraerExcel(file){
        if(typeof XLSX==='undefined') throw new Error('SheetJS/XLSX no está disponible.');
        const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellFormula:true,cellText:true,cellDates:true});
        const partes=[];
        for(const nombre of wb.SheetNames){
            const ws=wb.Sheets[nombre];
            const csv=XLSX.utils.sheet_to_csv(ws,{blankrows:false});
            const formulas=XLSX.utils.sheet_to_formulae(ws);
            partes.push(`=== HOJA: ${nombre} ===\n${csv}${formulas.length?`\n\n[FÓRMULAS]\n${formulas.join('\n')}`:''}`);
        }
        return partes.join('\n\n');
    }

    async function elixExtraerPDF(file){
        if(typeof pdfjsLib==='undefined') throw new Error('PDF.js no está disponible.');
        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        } catch(_){}
        const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
        const paginas=[];
        for(let n=1;n<=pdf.numPages;n++){
            const page=await pdf.getPage(n);
            const content=await page.getTextContent();
            const texto=content.items.map(i=>String(i.str||'')).join(' ').replace(/\s+/g,' ').trim();
            paginas.push(`=== PÁGINA ${n} ===\n${texto || '[Sin texto extraíble: posible página escaneada o contenido visual]'}`);
        }
        return paginas.join('\n\n');
    }

    async function elixExtraerTextoLocal(file){
        const ext=elixExtension(file.name);
        if(ext==='docx') return await elixExtraerDOCX(file);
        if(ext==='pptx') return await elixExtraerPPTX(file);
        if(ext==='xlsx'||ext==='xls') return await elixExtraerExcel(file);
        if(ext==='pdf') return await elixExtraerPDF(file);
        if(['txt','csv','md','json'].includes(ext) || String(file.type||'').startsWith('text/')) return await file.text();
        throw new Error(`Formato no soportado para extracción local: ${file.name}`);
    }

    function elixPartirTexto(texto,maxChars=24000){
        const s=String(texto||'');
        if(!s) return [''];
        const partes=[];
        let pos=0;
        while(pos<s.length){
            let fin=Math.min(pos+maxChars,s.length);
            if(fin<s.length){
                const salto=s.lastIndexOf('\n',fin);
                if(salto>pos+Math.floor(maxChars*.6)) fin=salto;
            }
            partes.push(s.slice(pos,fin));
            pos=fin;
        }
        return partes;
    }

    async function elixProcesarDocumentoConMini(file,solicitud){
        const bruto=await elixExtraerTextoLocal(file);
        if(!bruto.trim()) throw new Error(`${file.name} no contiene texto extraíble.`);
        const partes=elixPartirTexto(bruto);
        const salidas=[];

        for(let i=0;i<partes.length;i++){
            setCargando(true,`📎 Elix Mini O1 procesando ${file.name} (${i+1}/${partes.length})...`);
            const instrucciones=`Actúas como Elix Mini O1, preprocesador documental de alta fidelidad para DeepSeek.
Tu misión NO es responder todavía la solicitud final del usuario. Debes leer completamente el fragmento del archivo y producir un contexto fiel, estructurado y utilizable por DeepSeek.
No inventes, no corrijas silenciosamente y no omitas datos, cifras, fórmulas, encabezados, referencias, tablas o relaciones relevantes. Mantén ecuaciones en LaTeX cuando sea posible.
Archivo: ${file.name}
Fragmento: ${i+1} de ${partes.length}
Solicitud posterior del usuario: ${solicitud || 'Analizar el archivo adjunto.'}

CONTENIDO EXTRAÍDO:
${partes[i]}`;

            const r=await elixLlamarGroqConFallback([
                {role:'system',content:'Eres Elix Mini O1. Procesas archivos únicamente como etapa previa y entregas contexto documental fiel al motor principal.'},
                {role:'user',content:instrucciones}
            ],`Elix Mini O1 · ${file.name}`);
            salidas.push(`[${file.name} · fragmento ${i+1}/${partes.length} · ${r.model}]\n${r.text}`);
        }

        return salidas.join('\n\n');
    }

    async function elixProcesarImagenConMini(file,solicitud){
        const dataUrl=await elixArchivoADataURLMini(file);
        setCargando(true,`🖼️ Elix Mini O1 analizando ${file.name}...`);

        const prompt=`Actúas como Elix Mini O1, preprocesador visual para DeepSeek.
Examina la imagen completa y entrega una descripción/extracción fiel de TODO lo útil: texto visible, tablas, ecuaciones, símbolos, gráficos, diagramas, etiquetas, unidades y relaciones espaciales necesarias para resolver después la solicitud.
No resuelvas todavía la solicitud final. No inventes información que no sea visible.
Archivo: ${file.name}
Solicitud posterior del usuario: ${solicitud || 'Analizar la imagen adjunta.'}`;

        const r=await elixLlamarGroqConFallback([
            {role:'system',content:'Eres Elix Mini O1. Tu salida será contexto visual para DeepSeek.'},
            {role:'user',content:[
                {type:'text',text:prompt},
                {type:'image_url',image_url:{url:dataUrl}}
            ]}
        ],`Elix Mini O1 visual · ${file.name}`);

        return `[${file.name} · ${r.model}]\n${r.text}`;
    }

    async function elixProcesarAdjuntosConMini(files,solicitud){
        const resultados=[];
        for(let i=0;i<files.length;i++){
            const file=files[i];
            const esImagen=String(file.type||'').startsWith('image/');
            const salida=esImagen
                ? await elixProcesarImagenConMini(file,solicitud)
                : await elixProcesarDocumentoConMini(file,solicitud);
            resultados.push(`===== ARCHIVO ${i+1}/${files.length}: ${file.name} =====\n${salida}`);
        }
        return resultados.join('\n\n');
    }

    // Se acopla al enviar existente: si NO hay archivos, el flujo original queda intacto.
    const elixEnviarMensajeExistente = window.enviarMensaje;
    window.enviarMensaje = async function(){
        if(elixMiniProcesando) return;

        if(!elixAdjuntosPendientes.length){
            return await elixEnviarMensajeExistente();
        }

        const input=document.getElementById('user-input');
        const solicitud=(input?.value || '').trim() || 'Analiza los archivos adjuntos.';
        const snapshot=[...elixAdjuntosPendientes];
        const metadata=snapshot.map(f=>({name:f.name,size:f.size,type:f.type||'',lastModified:f.lastModified||0}));

        elixMiniProcesando=true;
        try{
            setCargando(true,'📎 Elix Mini O1 preparando archivos...');
            const contexto=await elixProcesarAdjuntosConMini(snapshot,solicitud);

            window.ELIX_CONTEXT_ARCHIVOS_PENDIENTE=contexto;
            window.ELIX_ADJUNTOS_EN_ENVIO=metadata;

            if(input && !input.value.trim()) input.value=solicitud;

            // Una vez que Mini O1 terminó, los archivos ya están representados por contexto + metadatos.
            elixLimpiarAdjuntosPendientes();
            elixMiniProcesando=false;
            setCargando(false);

            // Desde aquí vuelve al flujo existente (router, Tavily, DeepSeek, PDF, STOP, etc.).
            return await elixEnviarMensajeExistente();
        } catch(error){
            console.error('Elix Mini O1 no pudo procesar los adjuntos:',error);
            setCargando(false);
            const detalle=error?.message || String(error);
            alert(`No se pudieron procesar los adjuntos con Elix Mini O1.\n\n${detalle}`);
        } finally {
            elixMiniProcesando=false;
            window.ELIX_CONTEXT_ARCHIVOS_PENDIENTE='';
            window.ELIX_ADJUNTOS_EN_ENVIO=[];
        }
    };

    elixCrearBandejaAdjuntos();

    /* Word eliminado: PDF es la única exportación. */

    /* =========================================================
       C) PDF SOLO RESPUESTAS
       ========================================================= */
    window.exportarPDFSoloRespuestas = async function() {
        const chat=obtenerChatActual();
        const respuestas=(chat?.messages||[]).filter(m=>m.role==='assistant' && (m.content||'').trim());
        if(!respuestas.length) return alert('No hay respuestas de la IA para exportar a PDF.');

        document.getElementById('elix-print-root')?.remove();
        const root=document.createElement('div');
        root.id='elix-print-root';
        root.innerHTML=`<h1>Elix Pro — Respuestas</h1>` + respuestas.map((m,i)=>`<section class="elix-pdf-answer"><h2>Respuesta ${i+1}</h2>${formatTextoMarkdown(m.content||'')}</section>`).join('');
        document.body.appendChild(root);

        try {
            if(window.MathJax?.typesetPromise) await window.MathJax.typesetPromise([root]);
            if(document.fonts?.ready) await document.fonts.ready;
            await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
            const cleanup=()=>{ root.remove(); window.removeEventListener('afterprint',cleanup); };
            window.addEventListener('afterprint',cleanup);
            window.print();
            setTimeout(()=>{ if(document.body.contains(root)) root.remove(); },30000);
        } catch(e) {
            root.remove();
            console.error(e);
            alert('No se pudo preparar el PDF de respuestas.');
        }
    };

    // Toggle de sidebar en PC.
    const top=document.querySelector('.top-bar');

    if(top && title && !document.querySelector('.btn-sidebar-toggle')) {
